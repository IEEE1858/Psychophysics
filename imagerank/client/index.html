<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IEEE 1858 Image Rank</title>
    <meta
      name="description"
      content="Help the IEEE 1858 imaging standards group measure how sharpening and HDR processing change what looks real. 15–45 minutes on a laptop, no expertise required."
    />
    <link rel="canonical" href="https://imagerank.imatest.com/" />

    <!-- The Google Analytics tag is deliberately NOT here. It must not fire before
         consent in the EEA/UK, and anything in this shell runs on load. It is injected
         by src/lib/consent.js instead, either after consent or where consent is not
         required. -->

    <!-- Sharing card. Crawlers (Facebook, X, Bluesky, LinkedIn, Slack) do not run
         JavaScript, so these have to live in the static shell rather than being set
         from React. Absolute URLs are required: relative ones are not resolved. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IEEE 1858 Image Rank" />
    <meta property="og:url" content="https://imagerank.imatest.com/" />
    <meta property="og:title" content="Which photo do you like best, and which one looks real?" />
    <meta
      property="og:description"
      content="They are often not the same image. The IEEE 1858 imaging standards group is measuring that gap, and needs people to look at photos and choose. 15–45 minutes on a laptop, no expertise required."
    />
    <meta property="og:image" content="https://imagerank.imatest.com/imageRankFeature-social.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A sunflower and a graffiti underpass, each shown at three increasing levels of HDR processing."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Which photo do you like best, and which one looks real?" />
    <meta
      name="twitter:description"
      content="They are often not the same image. The IEEE 1858 imaging standards group is measuring that gap. 15–45 minutes on a laptop, no expertise required."
    />
    <meta name="twitter:image" content="https://imagerank.imatest.com/imageRankFeature-social.jpg" />
    <meta
      name="twitter:image:alt"
      content="A sunflower and a graffiti underpass, each shown at three increasing levels of HDR processing."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
